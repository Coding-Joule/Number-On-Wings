<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Coin Weighing</title><link rel="stylesheet" href="../main.css"></head><body><header></header><main><div class="eyebrow">Play / deduction</div><h1>COIN WEIGHING ⚖️</h1><p class="lead">One counterfeit coin. Choose whether its direction is known or unknown.</p><div class="gamebox"><button class="btn" onclick="start(false)">SIMPLE — fake is heavier</button> <button class="btn alt" onclick="start(true)">HARD — heavier OR lighter</button><div class="scale">⚪ ⚪ ⚪ ⚪ ⚪ ⚪ ⚪ ⚪ ⚪ ⚪ ⚪ ⚪</div><p id="game">Choose a mode.</p></div></main><script src="../nav.js"></script><script>function start(h){let n=h?12:9;document.querySelector('.scale').textContent=Array(n).fill('●').join(' ');document.getElementById('game').innerHTML=(h?'HARD':'SIMPLE')+' mode started. Full interactive balance-scale deduction engine is the next PLAY expansion.'}</script></body></html>
