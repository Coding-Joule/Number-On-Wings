<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NumberOnWings | Achievements</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<header></header>

<script src="save.js"></script>
<script src="nav.js"></script>

<main>

    <section class="container">

        <div class="eyebrow">
            Trophy Hangar
        </div>

        <h1>
            Achievements
        </h1>

        <p class="lead">
            Achievements are permanent milestones.
            Unlocking one can also award coins.
        </p>


        <div class="dashboard-grid">

            <div class="stat-card">
                <div class="stat-label">
                    Unlocked
                </div>

                <div
                    class="stat-value"
                    id="achievement-count"
                >
                    0
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-label">
                    Total
                </div>

                <div
                    class="stat-value"
                    id="achievement-total"
                >
                    0
                </div>
            </div>

        </div>


        <div
            class="achievement-grid"
            id="achievement-grid"
            style="margin-top: 26px;"
        ></div>

    </section>

</main>

<div class="mascot-note">
    <img
        src="IMG_3098.png"
        alt="IrAcoNAl"
    >

    <p>
        <strong>IrAcoNAl:</strong>
        A badge is just a tiny rectangle saying you did something cool.
    </p>
</div>

<script src="achievements.js"></script>

</body>
</html>
